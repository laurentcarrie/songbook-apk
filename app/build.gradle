plugins { id 'com.android.application' }
android {
    namespace 'com.laurentcarrie.zik'
    compileSdk 34
    defaultConfig {
        applicationId 'com.laurentcarrie.zik'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.yaml:snakeyaml:1.33:android'
}
