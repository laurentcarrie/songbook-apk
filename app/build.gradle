plugins { id 'com.android.application' }

// Release signing: the key and its passwords come from keystore.properties (not in git)
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

base.archivesName = 'laurent-zik'

android {
    namespace 'com.laurentcarrie.zik'
    compileSdk 34
    defaultConfig {
        applicationId 'com.laurentcarrie.zik'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false // SnakeYAML relies on reflection: keep the code as it is
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.yaml:snakeyaml:1.33:android'
}
