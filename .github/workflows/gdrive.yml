# When a pull request is merged into main (= a push to main), build the signed
# release apk and upload it to gdrive:apk/laurent-zik.apk with `make gdrive`.
#
# Secrets (set them with tools/set-ci-secrets.sh):
#   KEYSTORE_B64      the release keystore, base64
#   STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   its signing parameters
#   RCLONE_CONF_B64   an rclone.conf holding the [gdrive] remote, base64
name: apk to gdrive

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gdrive
  cancel-in-progress: false

jobs:
  gdrive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Build and upload
        run: make gdrive
